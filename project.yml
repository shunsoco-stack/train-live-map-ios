name: TrainLiveMap

options:
  bundleIdPrefix: com.shunsoco
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: ja

configs:
  Debug: debug
  Release: release
  Development: debug
  Staging: release
  Production: release

packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution.git
    exactVersion: 6.28.0

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: true
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: true
    GCC_TREAT_WARNINGS_AS_ERRORS: false

targets:
  TrainLiveMap:
    type: application
    platform: iOS
    sources:
      - path: TrainLiveMap
        excludes:
          - Info.plist
          - Resources
          - TrainLiveMap.entitlements
      - path: TrainLiveMap/Resources
        buildPhase: resources
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Production.xcconfig
      Development: Config/Development.xcconfig
      Staging: Config/Staging.xcconfig
      Production: Config/Production.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shunsoco.trainlivemap
        PRODUCT_NAME: Train Live Map
        PRODUCT_MODULE_NAME: TrainLiveMap
        INFOPLIST_FILE: TrainLiveMap/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LC47V8NZP6
        CODE_SIGN_ENTITLEMENTS: TrainLiveMap/TrainLiveMap.entitlements
        OTHER_LDFLAGS: "$(inherited) -ObjC"
    dependencies:
      - package: MapLibre
        product: MapLibre

  TrainLiveMapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TrainLiveMapTests
        excludes:
          - Fixtures
      - path: TrainLiveMapTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: TrainLiveMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shunsoco.trainlivemap.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Train Live Map.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Train Live Map"
        BUNDLE_LOADER: "$(TEST_HOST)"

  TrainLiveMapUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TrainLiveMapUITests
    dependencies:
      - target: TrainLiveMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shunsoco.trainlivemap.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: TrainLiveMap

schemes:
  TrainLiveMap:
    build:
      targets:
        TrainLiveMap: all
        TrainLiveMapTests: [test]
        TrainLiveMapUITests: [test]
    test:
      gatherCoverageData: true
      debugEnabled: false
      targets:
        - name: TrainLiveMapTests
          parallelizable: false
        - name: TrainLiveMapUITests
          parallelizable: false
    run:
      config: Debug
    archive:
      config: Production
